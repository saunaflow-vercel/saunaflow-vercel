<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sauna + Flow — Reset where you play</title>
<meta name="description" content="Mobile sauna and cold plunge experience for London's sports venues and communities. Heat. Cold. Connect." />
<meta property="og:title" content="Sauna + Flow" />
<meta property="og:description" content="Mobile sauna and cold plunge experience for London's sports venues and communities." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://saunaflow.co.uk/" />

<link rel="icon" href="assets/mark-flame-gold.png" />
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="site.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&amp;display=swap">
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="sections1.jsx"></script>
<script type="text/babel" src="sections2.jsx"></script>
<script type="text/babel" src="carousel.jsx"></script>
<script type="text/babel">
// ── Contact form ("Connect" section at the bottom) ──────────────
// Posts enquiries to a Google Apps Script that routes them to an
// "Enquiries" tab based on form: "contact".
window.SF_CONTACT_ENDPOINT = "https://script.google.com/macros/s/AKfycbzxd45xSbqYARrJBXGlTLNe4gmWjbpKHOvrQmx4QVJ6ZZ7h0EFk-iT9GpE41QhZdkCsjA/exec";

// ── Periode booking / signup pages ──────────────────────────────
// Drop-In, Regulars, and Private Hire membership cards link straight
// to their Periode pages. Nav/mobile-nav "Book" still scrolls to the
// Membership section (book() below).
window.SF_BOOKING_URL = "https://minside.periode.no/booking/4i57NVy4jvgeFRrJBAIS/1UKZKoJlzmDXhkytbTWO";
window.SF_REGULARS_SIGNUP_URL = "https://minside.periode.no/signup/5KzwU6VIhSLaod5FCFGQ";
window.SF_PRIVATE_HIRE_URL = "https://minside.periode.no/booking/4i57NVy4jvgeFRrJBAIS/XAFqvSZge4rPsDCrafb2";

// Master switch for membership booking. false = "Coming Soon" buttons and a
// hold-tight notice; true = Book buttons link to the Periode pages above.
window.SF_BOOKINGS_LIVE = true;

const TWEAK_DEFAULTS = {
  "motion": "calm",
  "grain": true,
  "parallax": true
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const contactRef = React.useRef(null);
  const [toast, setToast] = React.useState(false);

  // expose motion settings to imperative handlers (scroll / mousemove)
  window.SFM = { motion: t.motion, parallax: t.parallax };

  React.useEffect(() => {
    document.documentElement.dataset.motion = t.motion;
  }, [t.motion]);

  const book = () => { scrollToId("plans"); setToast(true); setTimeout(() => setToast(false), 2200); };

  return (
    <React.Fragment>
      <ScrollProgress />
      {t.grain && <Grain />}
      <AnnouncementBanner onBook={book} />
      <Navbar onBook={book} />
      <Hero onBook={book} />
      <Ritual />
      <Benefits />
      <Story />
      <BrandCarousel />
      <Plans />
      <FAQ />
      <Contact formRef={contactRef} />
      <Footer />
      <div className={"toast " + (toast ? "show" : "")}>Let's get you booked in →</div>

      <TweaksPanel>
        <TweakSection label="Motion" />
        <TweakRadio label="Intensity" value={t.motion} options={["calm", "cinematic", "bold"]} onChange={(v) => setTweak("motion", v)} />
        <TweakToggle label="Hero parallax" value={t.parallax} onChange={(v) => setTweak("parallax", v)} />
        <TweakSection label="Atmosphere" />
        <TweakToggle label="Film grain" value={t.grain} onChange={(v) => setTweak("grain", v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
